server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) - fall back to index.html for any
    # unmatched path instead of nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.png {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
